name: barusu
description: Fery's niri + strata + noctalia atomic image. Barusu!
base-image: ghcr.io/ublue-os/base-main
image-version: latest
modules:
  - type: files
    files:
      - source: system
        destination: /

  # System layer — 100% official Fedora, zero COPRs, purely additive
  - type: dnf
    install:
      packages:
        # -- session --
        - niri
        - noctalia
        - greetd
        - foot
        - pipewire
        - wireplumber
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk
        - gnome-keyring
        # -- strata runtime --
        - gtk4
        - gtksourceview5
        - poppler-glib
        - gvfs
        - bubblewrap
        - gstreamer1-plugins-base
        - gstreamer1-plugins-good
        - fontconfig
        - libheif
        - libraw
        - ImageMagick
        # -- plumbing --
        - steam-devices

  - type: script
    scripts:
      - strata.sh

  # CLI lane — the TOOL only; apps are your call at runtime
  - type: brew

  # GUI lane — Flathub (default repo), system scope, NOTHING prechosen
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system

  - type: signing
