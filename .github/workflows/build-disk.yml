---
name: Build disk image
on:
  schedule:
    - cron: "0 1 * * TUE"
  workflow_dispatch:

jobs:
  build_release:
    if: vars.BARUSU_PUBLISH == 'true'
    name: Build and release disk image
    permissions:
      contents: read
      packages: read
      id-token: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: ["amd64", "arm64"]
        flavor: ["", "-nvidia"]
    runs-on: ${{ matrix.platform == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}

    steps:
      - name: Free disk space
        uses: hastd/free-disk-space@68572aeaadb7f76bd408246328e95926323402b5 # v0.1.2
        with:
          skip-if-available: "64G"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Verify installer identity
        run: python3 scripts/configure-image.py "$GITHUB_REPOSITORY" --check

      - name: Build ISO
        id: build-iso
        env:
          TARGET_IMAGE: ghcr.io/${{ github.repository_owner }}/barusu${{ matrix.flavor }}:latest
          TARGET_CONFIG: ${{ matrix.flavor == '-nvidia' && './iso-nvidia.toml' || './iso.toml' }}
        run: |
          sudo podman pull "${TARGET_IMAGE}"
          sudo mkdir -p rpm-gpg output
          sudo podman run --rm -it -v ./rpm-gpg:/out:Z "${TARGET_IMAGE}" bash -c 'cp /etc/pki/rpm-gpg/* /out'
          sudo podman run \
            --rm -it \
            --privileged \
            --pull=newer \
            --security-opt label=type:unconfined_t \
            -v "${TARGET_CONFIG}:/config.toml:ro" \
            -v ./output/:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v ./rpm-gpg/:/etc/pki/rpm-gpg/:ro \
            quay.io/centos-bootc/bootc-image-builder:latest --type iso --rootfs btrfs --use-librepo=True \
            "${TARGET_IMAGE}"
          echo "output-directory=$(realpath ./output)" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: barusu${{ matrix.flavor }}-${{ matrix.platform }}
          path: ${{ steps.build-iso.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true

      - name: Name installer artifacts
        env:
          FLAVOR: ${{ matrix.flavor }}
          PLATFORM: ${{ matrix.platform }}
          SOURCE_DIR: ${{ steps.build-iso.outputs.output-directory }}
        run: |
          set -euo pipefail
          sudo mv "${SOURCE_DIR}"/*/*.iso "${SOURCE_DIR}/barusu${FLAVOR}-${PLATFORM}.iso"
          (cd "${SOURCE_DIR}" && sha256sum "barusu${FLAVOR}-${PLATFORM}.iso" | sudo tee "barusu${FLAVOR}-${PLATFORM}.iso-CHECKSUM")

      - name: Upload to S3
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        env:
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_TYPE: s3
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          SOURCE_DIR: ${{ steps.build-iso.outputs.output-directory }}
        run: |
          sudo apt update -y
          sudo apt install -y rclone
          rclone copy "${SOURCE_DIR}"/*.iso "S3:${S3_BUCKET_NAME}"
          rclone copy "${SOURCE_DIR}"/*.iso-CHECKSUM "S3:${S3_BUCKET_NAME}"
